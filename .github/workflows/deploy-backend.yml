name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/api/**
      - workers/evalscope/**
      - packages/**
      - prisma/**
      - deploy/ecs/**
      - deploy/evalscope/**
      - deploy/smoke.sh
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.base.json
      - .github/workflows/deploy-backend.yml

permissions:
  contents: read

concurrency:
  group: databench-production-backend
  cancel-in-progress: false

env:
  API_IMAGE_NAME: databench-api
  EVALSCOPE_IMAGE_NAME: databench-evalscope
  IMAGE_ARCHIVE_NAME: databench-release
  REMOTE_APP_DIR: /opt/databench

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build API image for ECS
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --cache-from type=gha,scope=databench-api \
            --cache-to type=gha,mode=max,scope=databench-api \
            -f apps/api/Dockerfile \
            -t "${API_IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Build EvalScope image for ECS
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --cache-from type=gha,scope=databench-evalscope \
            --cache-to type=gha,mode=max,scope=databench-evalscope \
            -f deploy/evalscope/Dockerfile \
            -t "${EVALSCOPE_IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Save release image archive
        run: |
          docker save \
            "${API_IMAGE_NAME}:${GITHUB_SHA}" \
            "${EVALSCOPE_IMAGE_NAME}:${GITHUB_SHA}" \
            | gzip > "${IMAGE_ARCHIVE_NAME}-${GITHUB_SHA}.tar.gz"

      - name: Configure SSH
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: |
          test -n "${ECS_HOST}"
          test -n "${ECS_SSH_KEY}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${ECS_SSH_KEY}" > ~/.ssh/ecs_deploy
          chmod 600 ~/.ssh/ecs_deploy
          if [ -n "${ECS_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${ECS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${ECS_HOST}" > ~/.ssh/known_hosts
          fi

      - name: Upload deploy assets
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          ECS_USER="${ECS_USER:-root}"
          ssh -i ~/.ssh/ecs_deploy "${ECS_USER}@${ECS_HOST}" \
            "mkdir -p '${REMOTE_APP_DIR}/releases' '${REMOTE_APP_DIR}/caddy'"
          scp -i ~/.ssh/ecs_deploy \
            deploy/ecs/docker-compose.yml deploy/ecs/deploy.sh deploy/ecs/cleanup.sh \
            deploy/ecs/api.env.example deploy/ecs/evalscope.env.example \
            deploy/ecs/model-endpoint-policy.example.json \
            deploy/ecs/evalscope-model-credentials.example.json \
            deploy/ecs/deploy.env.example \
            "${ECS_USER}@${ECS_HOST}:${REMOTE_APP_DIR}/"
          scp -i ~/.ssh/ecs_deploy deploy/ecs/caddy/Caddyfile \
            "${ECS_USER}@${ECS_HOST}:${REMOTE_APP_DIR}/caddy/Caddyfile"
          ssh -i ~/.ssh/ecs_deploy "${ECS_USER}@${ECS_HOST}" \
            "chmod +x '${REMOTE_APP_DIR}/deploy.sh' '${REMOTE_APP_DIR}/cleanup.sh' && \
             APP_DIR='${REMOTE_APP_DIR}' '${REMOTE_APP_DIR}/cleanup.sh' '${GITHUB_SHA}' '' before-upload"
          scp -i ~/.ssh/ecs_deploy "${IMAGE_ARCHIVE_NAME}-${GITHUB_SHA}.tar.gz" \
            "${ECS_USER}@${ECS_HOST}:${REMOTE_APP_DIR}/releases/${IMAGE_ARCHIVE_NAME}-${GITHUB_SHA}.tar.gz.part"
          ssh -i ~/.ssh/ecs_deploy "${ECS_USER}@${ECS_HOST}" \
            "mv '${REMOTE_APP_DIR}/releases/${IMAGE_ARCHIVE_NAME}-${GITHUB_SHA}.tar.gz.part' \
                '${REMOTE_APP_DIR}/releases/${IMAGE_ARCHIVE_NAME}-${GITHUB_SHA}.tar.gz'"

      - name: Deploy on ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          ECS_USER="${ECS_USER:-root}"
          ssh -i ~/.ssh/ecs_deploy "${ECS_USER}@${ECS_HOST}" \
            "'${REMOTE_APP_DIR}/deploy.sh' '${REMOTE_APP_DIR}/releases/${IMAGE_ARCHIVE_NAME}-${GITHUB_SHA}.tar.gz' '${GITHUB_SHA}'"

      - name: Smoke test
        run: deploy/smoke.sh https://api.databench.jinjing.me

      - name: Authenticated EvalScope origin smoke
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          ECS_USER="${ECS_USER:-root}"
          ssh -i ~/.ssh/ecs_deploy "${ECS_USER}@${ECS_HOST}" \
            "set -eu; token=\$(grep -E '^DATABENCH_EVALSCOPE_ACCESS_TOKEN=' '${REMOTE_APP_DIR}/api.env' | tail -n1 | cut -d= -f2-); \
             curl -fsS -H \"Authorization: Bearer \${token}\" 'https://api.databench.jinjing.me/evalscope-api/health' | grep -q 'ready'; \
             curl -fsS -H \"Authorization: Bearer \${token}\" 'https://api.databench.jinjing.me/evalscope-api/api/v1/config' | grep -q 'evalscope_commit'"
