name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  swift-studio-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@v6
        with:
          python-version: 3.11.15

      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.1

      - run: uv sync --directory workers/swift-studio --frozen
      - run: pnpm swift:baseline:check:green
      - run: pnpm swift:baseline:test
      - run: pnpm test:swift:python
      - run: pnpm swift:s1:gpu:driver:test
      - run: pnpm swift:s1:gpu:runner:test
      - run: pnpm swift:s1:gpu:evidence:test

  worker-foundation:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: 3.11.15

      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.1

      - run: pnpm install --frozen-lockfile
      - run: uv sync --directory workers/python --frozen
      - run: pnpm codegen:worker:check
      - run: pnpm test:worker:python
      - run: pnpm --filter @databench/workspace test:worker

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Install pnpm (version from the root packageManager field) BEFORE
      # setup-node, so setup-node's pnpm store cache can resolve the binary.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm v2:status:check
      - run: pnpm evalscope:parity:check
      - run: pnpm evalscope:parity:test
      - run: pnpm ecs:check

      # Stateful backends for the golden/e2e tests. The store suite creates its
      # own temporary bucket, so minio-init is not required here.
      - run: docker compose up -d --wait postgres minio

      # The pg driver adapter ignores the connection URL's ?schema param, so the
      # runtime queries the public schema. Migrate it here (CI's DB starts empty;
      # locally it happens to be migrated already).
      - run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://databench:databench@localhost:55432/databench?schema=public

      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
        env:
          RUN_MINIO_STORE_TESTS: "true"
      - run: pnpm openapi:check

      - if: always()
        run: docker compose down -v

  v2-parquet-determinism:
    name: V2 Parquet determinism (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-latest
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @databench/engine... build

      - run: >-
          pnpm --filter @databench/engine test:parquet-determinism
          --maxWorkers=1
          --minWorkers=1
          --no-file-parallelism
        env:
          DATABENCH_V2_PARQUET_EXPECTED_PLATFORM: ${{ matrix.platform }}

  v2-parquet-determinism-gate:
    name: v2-parquet-determinism-gate
    if: always()
    needs:
      - v2-parquet-determinism
    runs-on: ubuntu-latest
    steps:
      - name: Require every V2 Parquet determinism matrix job
        env:
          MATRIX_RESULT: ${{ needs.v2-parquet-determinism.result }}
        run: test "$MATRIX_RESULT" = "success"
