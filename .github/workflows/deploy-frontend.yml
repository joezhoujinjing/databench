name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/web/**
      - apps/api/src/openapi.ts
      - apps/api/src/routes/**
      - packages/schema/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.base.json
      - .github/workflows/deploy-frontend.yml
      - deploy/ecs/configure-cdn-evalscope.sh

permissions:
  contents: read

env:
  API_BASE_URL: ${{ vars.DATABENCH_API_BASE_URL || 'https://api.databench.jinjing.me' }}
  ALIYUN_REGION: ${{ vars.ALIYUN_REGION || 'cn-hongkong' }}
  OSS_ENDPOINT: ${{ vars.WEB_OSS_ENDPOINT || 'oss-cn-hongkong.aliyuncs.com' }}
  WEB_OSS_BUCKET: ${{ vars.WEB_OSS_BUCKET || 'databench-ui' }}
  CDN_DOMAIN: ${{ vars.CDN_DOMAIN || 'databench.jinjing.me' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @databench/web build
        env:
          VITE_DATABENCH_API_BASE_URL: ${{ env.API_BASE_URL }}

      - name: Install Aliyun CLI
        run: |
          URL=$(curl -fsSL https://api.github.com/repos/aliyun/aliyun-cli/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux.*amd64\\.tgz$")) | .browser_download_url' \
            | head -1)
          echo "Downloading ${URL}"
          curl -fsSL -o aliyun-cli.tgz "${URL}"
          tar -xzf aliyun-cli.tgz
          sudo mv aliyun /usr/local/bin/aliyun
          aliyun version

      - name: Configure Aliyun CLI
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          test -n "${ALIYUN_ACCESS_KEY_ID}"
          test -n "${ALIYUN_ACCESS_KEY_SECRET}"
          aliyun configure set --profile ci --mode AK --region "${ALIYUN_REGION}" \
            --access-key-id "${ALIYUN_ACCESS_KEY_ID}" \
            --access-key-secret "${ALIYUN_ACCESS_KEY_SECRET}"

      - name: Upload dist to OSS
        run: |
          aliyun --profile ci oss sync apps/web/dist/ "oss://${WEB_OSS_BUCKET}/" \
            --endpoint "${OSS_ENDPOINT}" --delete -f
          aliyun --profile ci oss set-meta "oss://${WEB_OSS_BUCKET}/index.html" Cache-Control:no-cache \
            --endpoint "${OSS_ENDPOINT}" -f

      - name: Configure EvalScope conditional origin
        run: deploy/ecs/configure-cdn-evalscope.sh
        env:
          ALIYUN_PROFILE: ci
          EVALSCOPE_ORIGIN_HOST: api.databench.jinjing.me

      - name: Refresh CDN
        run: |
          aliyun cdn RefreshObjectCaches \
            --ObjectPath "https://${CDN_DOMAIN}/" --ObjectType Directory --profile ci
          aliyun cdn RefreshObjectCaches \
            --ObjectPath "https://${CDN_DOMAIN}/index.html" --ObjectType File --profile ci
          aliyun cdn RefreshObjectCaches \
            --ObjectPath "https://${CDN_DOMAIN}/evalscope-api/" --ObjectType Directory --profile ci

      - name: Configure SSH for authenticated smoke
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: |
          test -n "${ECS_HOST}"
          test -n "${ECS_SSH_KEY}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${ECS_SSH_KEY}" > ~/.ssh/ecs_deploy
          chmod 600 ~/.ssh/ecs_deploy
          if [ -n "${ECS_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${ECS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${ECS_HOST}" > ~/.ssh/known_hosts
          fi

      - name: Verify public EvalScope route
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://${CDN_DOMAIN}/evalscope-api/health")
            if [ "${status}" = 401 ]; then
              break
            fi
            if [ "${attempt}" = 30 ]; then
              echo "EvalScope CDN route returned ${status}, expected 401" >&2
              exit 1
            fi
            sleep 10
          done
          ECS_USER="${ECS_USER:-root}"
          ssh -i ~/.ssh/ecs_deploy "${ECS_USER}@${ECS_HOST}" \
            "set -eu; token=\$(grep -E '^DATABENCH_EVALSCOPE_ACCESS_TOKEN=' /opt/databench/api.env | tail -n1 | cut -d= -f2-); \
             curl -fsS -H \"Authorization: Bearer \${token}\" 'https://${CDN_DOMAIN}/evalscope-api/health' >/dev/null; \
             curl -fsS -H \"Authorization: Bearer \${token}\" 'https://${CDN_DOMAIN}/evalscope-api/api/v1/config' | grep -q 'evalscope_commit'"
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://${CDN_DOMAIN}/evalscope-api/unknown")" = 404
