syntax = "proto3";

package databench.worker.v1;

service WorkerService {
  rpc DescribeCapabilities(DescribeCapabilitiesRequest) returns (DescribeCapabilitiesResponse);
  // A valid terminal JobEvent is only a completion candidate. The caller must
  // also observe gRPC OK EOF within its terminal-EOF deadline.
  rpc RunJob(RunJobRequest) returns (stream JobEvent);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
}

message DescribeCapabilitiesRequest {}

message DescribeCapabilitiesResponse {
  string worker_version = 1;
  repeated Capability capabilities = 2;
}

message Capability {
  string name = 1;
  string version = 2;
  CapabilityMode mode = 3;
  string parameter_schema_name = 4;
  string parameter_schema_version = 5;
  repeated ArtifactContract inputs = 6;
  repeated ArtifactContract outputs = 7;
}

enum CapabilityMode {
  CAPABILITY_MODE_UNSPECIFIED = 0;
  CAPABILITY_MODE_BATCH = 1;
}

message ArtifactContract {
  string name = 1;
  string media_type = 2;
}

message JsonPayload {
  string schema_name = 1;
  string schema_version = 2;
  bytes utf8_json = 3;
}

message InputArtifact {
  string name = 1;
  string read_url = 2;
  string media_type = 3;
  uint64 size = 4;
  string digest = 5;
}

message OutputTarget {
  string name = 1;
  string write_url = 2;
  string media_type = 3;
  uint64 max_size = 4;
}

message RunJobRequest {
  string execution_id = 1;
  string job_id = 2;
  uint32 attempt = 3;
  bytes lease_token = 4;
  string capability_name = 5;
  string capability_version = 6;
  JsonPayload parameters = 7;
  repeated InputArtifact inputs = 8;
  repeated OutputTarget outputs = 9;
  int64 deadline_unix_ms = 10;
}

// Exactly one terminal variant must be emitted. EOF without terminal,
// non-OK EOF, duplicate terminal, and any event after terminal are failures.
message JobEvent {
  oneof event {
    AcceptedEvent accepted = 1;
    StartedEvent started = 2;
    ProgressEvent progress = 3;
    HeartbeatEvent heartbeat = 4;
    CompletedEvent completed = 5;
    FailedEvent failed = 6;
    CancelledEvent cancelled = 7;
  }
}

message AcceptedEvent {
  int64 timestamp_unix_ms = 1;
}

message StartedEvent {
  int64 timestamp_unix_ms = 1;
}

message ProgressEvent {
  int64 timestamp_unix_ms = 1;
  string phase = 2;
  uint64 completed_units = 3;
  optional uint64 total_units = 4;
}

message HeartbeatEvent {
  int64 timestamp_unix_ms = 1;
}

message OutputArtifact {
  string name = 1;
  uint64 size = 2;
  string digest = 3;
  uint64 record_count = 4;
}

message CompletedEvent {
  int64 timestamp_unix_ms = 1;
  repeated OutputArtifact outputs = 2;
}

message FailedEvent {
  int64 timestamp_unix_ms = 1;
  string code = 2;
  string message = 3;
  bool retryable = 4;
}

message CancelledEvent {
  int64 timestamp_unix_ms = 1;
  string message = 2;
}

message CancelJobRequest {
  string execution_id = 1;
  uint32 attempt = 2;
  bytes lease_token = 3;
}

message CancelJobResponse {
  CancelResult result = 1;
}

enum CancelResult {
  CANCEL_RESULT_UNSPECIFIED = 0;
  CANCEL_RESULT_STOPPED = 1;
  CANCEL_RESULT_NOT_FOUND = 2;
  CANCEL_RESULT_TOKEN_MISMATCH = 3;
}
