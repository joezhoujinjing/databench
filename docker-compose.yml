services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: databench
      POSTGRES_PASSWORD: databench
      POSTGRES_DB: databench
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U databench -d databench"]
      interval: 5s
      timeout: 5s
      retries: 20

# The object store (data plane) is Aliyun OSS — there is no local object-store
# service. Unit/e2e tests use an in-memory store; the store integration test and
# real app runs require OSS_* credentials (see .env.example). Only Postgres runs
# locally.

volumes:
  postgres-data:
