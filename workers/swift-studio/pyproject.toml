[project]
name = "databench-swift-studio-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.140.7",
  "httpx==0.28.1",
  "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
