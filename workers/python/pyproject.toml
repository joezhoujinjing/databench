[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "databench-worker"
version = "0.1.0"
description = "Databench generic Python capability worker"
requires-python = "==3.11.*"
dependencies = [
  "grpcio==1.83.0",
  "grpcio-health-checking==1.83.0",
  "py-data-juicer==1.5.3",
  "protobuf==7.35.1",
  "ray[default]==2.56.1",
  "torch==2.8.0",
]

[project.scripts]
databench-worker = "databench_worker.grpc_server:main"
databench-worker-healthcheck = "databench_worker.healthcheck:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  "grpcio-tools==1.83.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/databench", "src/databench_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
