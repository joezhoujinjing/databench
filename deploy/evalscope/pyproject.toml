[project]
name = "databench-evalscope-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bleach==6.2.0",
  "evalscope[service]",
  "flask==3.1.2",
  "gunicorn==23.0.0",
  "html5lib==1.1",
  "httpx==0.28.1",
  "rfc8785==0.1.4",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[tool.uv]
package = false

[tool.uv.sources]
evalscope = { path = "vendor/evalscope-upstream.tar.gz" }

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"
pythonpath = ["runtime"]
