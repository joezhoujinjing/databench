name: databench-offline

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

x-service-defaults: &service-defaults
  platform: linux/amd64
  pull_policy: never
  logging: *default-logging
  networks:
    - databench
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *service-defaults
    image: ${DATABENCH_POSTGRES_IMAGE:?missing DATABENCH_POSTGRES_IMAGE}
    container_name: databench-offline-postgres
    restart: unless-stopped
    env_file:
      - /etc/databench/databench.env
    volumes:
      - /srv/databench/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio:
    <<: *service-defaults
    image: ${DATABENCH_MINIO_IMAGE:?missing DATABENCH_MINIO_IMAGE}
    container_name: databench-offline-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - /etc/databench/databench.env
    volumes:
      - /srv/databench/minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio-init:
    <<: *service-defaults
    image: ${DATABENCH_MINIO_MC_IMAGE:?missing DATABENCH_MINIO_MC_IMAGE}
    container_name: databench-offline-minio-init
    env_file:
      - /etc/databench/databench.env
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio/app-policy.json:/config/app-policy.json:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc admin user add local "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}" || \
          mc admin user enable local "$${S3_ACCESS_KEY_ID}"
        mc admin policy create local databench-app /config/app-policy.json || true
        mc admin policy attach local databench-app --user "$${S3_ACCESS_KEY_ID}"
        mc anonymous set none "local/$${S3_BUCKET}"
    restart: "no"

  migrate:
    <<: *service-defaults
    image: ${DATABENCH_API_IMAGE:?missing DATABENCH_API_IMAGE}
    container_name: databench-offline-migrate
    env_file:
      - /etc/databench/databench.env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"

  worker:
    <<: *service-defaults
    image: ${DATABENCH_WORKER_IMAGE:?missing DATABENCH_WORKER_IMAGE}
    container_name: databench-offline-worker
    restart: unless-stopped
    environment:
      DATABENCH_WORKER_BIND: "0.0.0.0:50051"
      DATABENCH_WORKER_TEMP_ROOT: "/tmp/databench-worker-v1"
    depends_on:
      minio:
        condition: service_healthy
    tmpfs:
      - /tmp:size=4g,mode=1777
    read_only: true
    mem_limit: 16g
    cpus: 6.0
    pids_limit: 512
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "/app/.venv/bin/databench-worker-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  evalscope:
    <<: *service-defaults
    image: ${DATABENCH_EVALSCOPE_IMAGE:?missing DATABENCH_EVALSCOPE_IMAGE}
    container_name: databench-offline-evalscope
    restart: unless-stopped
    env_file:
      - /etc/databench/evalscope.env
    environment:
      CUDA_VISIBLE_DEVICES: ""
      NVIDIA_VISIBLE_DEVICES: "void"
      HOME: /var/lib/evalscope/home
      EVALSCOPE_SERVE_WEB: "false"
      EVALSCOPE_OUTPUT_DIR: /var/lib/evalscope/outputs
      EVALSCOPE_INPUT_DIR: /var/lib/evalscope/inputs
      EVALSCOPE_ALLOWED_MEDIA_ROOTS: /var/lib/evalscope/outputs,/var/lib/evalscope/inputs
      EVALSCOPE_MODEL_REDIRECT_MAX_HOPS: "0"
      EVALSCOPE_PLOTLY_ASSET_PATH: /opt/vendor/plotly-2.35.2.min.js
      EVALSCOPE_PLOTLY_ASSET_SHA256: 6d21266ce1bd7d9e5ab4e115989c70c20de0382fd973a8f26ab58619eba4d603
      DATABENCH_BASE_URL: http://api:8000
      EVALSCOPE_MODEL_ENDPOINT_POLICY: /run/config/model-endpoint-policy.json
      EVALSCOPE_MODEL_CREDENTIALS: /run/secrets/evalscope-model-credentials.json
    volumes:
      - /srv/databench/evalscope/outputs:/var/lib/evalscope/outputs
      - /srv/databench/evalscope/inputs:/var/lib/evalscope/inputs
      - /etc/databench/model-endpoint-policy.json:/run/config/model-endpoint-policy.json:ro
      - /etc/databench/secrets/evalscope-model-credentials.json:/run/secrets/evalscope-model-credentials.json:ro
    tmpfs:
      - /tmp:size=2g,mode=1777
      - /var/lib/evalscope/home:size=512m,uid=10001,gid=10001,mode=0700
    read_only: true
    mem_limit: 12g
    cpus: 4.0
    pids_limit: 1024
    stop_grace_period: 60s
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/app/.venv/bin/python -c \"import json,urllib.request; body=json.load(urllib.request.urlopen('http://127.0.0.1:9000/health',timeout=3)); raise SystemExit(0 if body.get('ready') is True else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  swift-studio:
    <<: *service-defaults
    profiles: ["swift-studio"]
    image: ${DATABENCH_SWIFT_IMAGE:?missing DATABENCH_SWIFT_IMAGE}
    container_name: databench-offline-swift-studio
    restart: unless-stopped
    init: true
    env_file:
      - /etc/databench/swift.env
    environment:
      DATABENCH_API_BASE_URL: http://api:8000
      DATABENCH_SWIFT_ROOT_PATH: /swift-studio
      DATABENCH_SWIFT_SESSION_LABEL: Databench Offline GPU Studio
      DATABENCH_SWIFT_WORKSPACE_ROOT: /var/lib/databench-swift-studio
      HF_HOME: /var/lib/databench-swift-studio/cache/huggingface
      HOME: /var/lib/databench-swift-studio/home
      MODELSCOPE_CACHE: /var/lib/databench-swift-studio/cache/modelscope
      SWIFT_UI_LANG: zh
      WEBUI_SHARE: "false"
    volumes:
      - /srv/databench/swift-studio:/var/lib/databench-swift-studio
      - /srv/databench/swift-models:/opt/databench-models:ro
    tmpfs:
      - /tmp:size=8g,mode=1777
    shm_size: 8gb
    stop_grace_period: 120s
    pids_limit: 4096
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json,urllib.request; body=json.load(urllib.request.urlopen('http://127.0.0.1:7861/runtime',timeout=3)); raise SystemExit(0 if body.get('ready') is True else 1)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s

  api:
    <<: *service-defaults
    image: ${DATABENCH_API_IMAGE:?missing DATABENCH_API_IMAGE}
    container_name: databench-offline-api
    restart: unless-stopped
    env_file:
      - /etc/databench/databench.env
      - /etc/databench/mcp.env
      - /etc/databench/swift.env
    environment:
      DATABENCH_OPENAPI_SERVER_URL: "/api"
      DATABENCH_EVALSCOPE_ENABLED: "true"
      DATABENCH_EVALSCOPE_INTRANET_HTTP_DOCUMENTS: "true"
      DATABENCH_EVALSCOPE_INTERNAL_BASE_URL: "http://evalscope:9000"
      DATABENCH_EVALSCOPE_ALLOWED_ROUTES_MANIFEST: "/app/evalscope-api-routes.json"
      DATABENCH_SWIFT_STUDIO_ENABLED: "${DATABENCH_SWIFT_ENABLED:-false}"
      DATABENCH_SWIFT_STUDIO_DATABENCH_BASE_URL: "http://api:8000"
      DATABENCH_SWIFT_STUDIO_IMAGE_DIGEST: "${DATABENCH_SWIFT_IMAGE_DIGEST:?missing DATABENCH_SWIFT_IMAGE_DIGEST}"
      DATABENCH_SWIFT_STUDIO_INTERNAL_BASE_URL: "http://swift-studio:7860"
      DATABENCH_SWIFT_STUDIO_PROVIDER_BASE_URL: "http://swift-studio:7861"
      DATABENCH_SWIFT_STUDIO_ROUTES_MANIFEST: "/app/swift-studio-gradio-routes.json"
      DATABENCH_WORKER_ENABLED: "true"
      DATABENCH_WORKER_TARGET: "worker:50051"
      DATABENCH_MODEL_ENDPOINT_POLICY: "/run/config/model-endpoint-policy.json"
      DATABENCH_MODEL_CREDENTIALS: "/run/secrets/api-model-credentials.json"
      NODE_ENV: production
      PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    volumes:
      - /srv/databench/workspace:/var/lib/databench
      - /etc/databench/model-endpoint-policy.json:/run/config/model-endpoint-policy.json:ro
      - /etc/databench/secrets/api-model-credentials.json:/run/secrets/api-model-credentials.json:ro
    tmpfs:
      - /tmp:size=1g,mode=1777
    read_only: true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8000/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    <<: *service-defaults
    image: ${DATABENCH_WEB_IMAGE:?missing DATABENCH_WEB_IMAGE}
    container_name: databench-offline-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    read_only: true
    tmpfs:
      - /config:size=16m,mode=0700
      - /data:size=16m,mode=0700

networks:
  databench:
    name: databench-offline
    driver: bridge
